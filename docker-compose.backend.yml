services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: store
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d store"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://store:store@db:5432/store
      API_ADMIN_TOKEN: change-me-in-development
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      UPLOAD_DIR: /app/uploads
      # Login con Google (dejar vacío hasta tener credenciales en Google Cloud Console)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/auth/google/callback}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-alvaro.dario09@gmail.com}
      # Secreto compartido con Next.js para firmar la sesión (cambiar en producción)
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change-me-in-development}
      # Confirmación de cuentas por correo (Resend). Sin estas dos variables la
      # verificación queda desactivada y las cuentas nuevas entran activas.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_EMAIL_FROM: ${RESEND_EMAIL_FROM:-}
      STORE_NAME: ${STORE_NAME:-BOSQUE}
      STORE_URL: ${STORE_URL:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  uploads_data: